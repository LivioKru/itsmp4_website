<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <title>Weiterleitung … | itsmp4</title>
  <meta name="robots" content="noindex, follow">
  <!-- Alte Adressen (projekt.html?p=…) leiten auf die neuen Projektseiten weiter -->
  <script>
    const slug = new URLSearchParams(location.search).get("p");
    location.replace("referenzen" + (slug ? "#" + encodeURIComponent(slug) : ""));
  </script>
</head>
<body>
  <p><a href="referenzen">Zu Selected Work</a></p>
</body>
</html>
