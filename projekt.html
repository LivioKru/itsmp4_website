<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <title>Weiterleitung … | itsmp4</title>
  <meta name="robots" content="noindex, follow">
  <!-- Alte Adressen (projekt.html?p=…) leiten auf die neuen Projektseiten weiter -->
  <script>
    const slug = new URLSearchParams(location.search).get("p");
    location.replace(slug ? "projekte/" + encodeURIComponent(slug) + ".html" : "referenzen.html");
  </script>
</head>
<body>
  <p><a href="referenzen.html">Zu den Referenzen</a></p>
</body>
</html>
